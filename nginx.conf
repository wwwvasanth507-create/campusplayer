# CampusPlayer Production Nginx Configuration
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Realistic body size limits (Up to 50 GB per upload session)
    client_max_body_size 50G;
    client_body_buffer_size 1m;
    client_body_timeout 300s;
    send_timeout 300s;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # HLS MIME types
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }

    upstream campusplayer_app {
        server web:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Static files
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Multi-Tenant Isolated Storage Media Delivery (Range Requests supported)
        location /storage/ {
            alias /app/storage/;
            expires 7d;
            add_header Cache-Control "public, no-cache";
            add_header Access-Control-Allow-Origin "*";
            add_header Accept-Ranges bytes;
        }

        # HLS streaming — optimized delivery
        location /static/hls/ {
            alias /app/static/hls/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "no-cache";
            gzip off;
        }

        # Resumable Chunk Upload endpoints — direct proxy streaming without request buffering
        location /api/uploads/ {
            proxy_pass http://campusplayer_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Main application + WebSocket (SocketIO)
        location / {
            proxy_pass http://campusplayer_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }

        # Liveness / Health check
        location /api/health {
            proxy_pass http://campusplayer_app;
            access_log off;
        }
    }
}