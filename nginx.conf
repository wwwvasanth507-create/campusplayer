# CampusPlayer Nginx Configuration — UNLIMITED MODE
events {
    # UNLIMITED: Maximum possible concurrent connections
    worker_connections 1048576;
    use epoll;
    multi_accept on;
    accept_mutex off;
    worker_aio_requests 65536;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance settings — maximum throughput
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 86400;
    keepalive_requests 1000000;
    types_hash_max_size 2048;
    
    # UNLIMITED: No body size restrictions (support 25GB+)
    client_max_body_size 0;
    client_body_buffer_size 0;
    client_body_in_single_buffer off;
    client_body_timeout 86400s;
    send_timeout 86400s;
    
    # Proxy settings — no timeouts
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 86400s;
    proxy_buffer_size 512k;
    proxy_buffers 32 512k;
    proxy_busy_buffers_size 2m;
    proxy_temp_file_write_size 2m;
    
    # UNLIMITED: Remove all rate limiting
    # (no limit_req_zone, no limit_conn_zone)
    
    # Optimize sendfile
    aio on;
    directio 4m;
    output_buffers 128 512k;
    lingering_close off;
    reset_timedout_connection on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # HLS MIME types
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }

    # Cache zones — maximum size
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=hls_cache:1000m max_size=100g inactive=60m;
    proxy_cache_path /tmp/nginx_upload_cache levels=1:2 keys_zone=upload_cache:500m max_size=50g inactive=30m;
    open_file_cache max=1000000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    upstream campusplayer {
        server web:5000;
        keepalive 1024;
    }

    # HTTP Server
    server {
        listen 80;
        server_name localhost;
        
        # Redirect to HTTPS in production
        # return 301 https://$host$request_uri;

        # Static files
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # HLS streaming - optimized delivery
        location /static/hls/ {
            alias /app/static/hls/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "no-cache";
            expires -1;
            
            # No gzip for HLS
            gzip off;
        }

    # Upload chunk endpoint — UNLIMITED throughput
    location /teacher/upload_chunk {
        # UNLIMITED: No rate limits, no connection limits
        # limit_req zone=upload burst=500000 nodelay;  — REMOVED
        # limit_conn conn_limit 1000;  — REMOVED
        
        proxy_pass http://campusplayer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Optimized for chunk uploads
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_buffer_size 0;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # CORS for upload
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
    }
    
    # API upload endpoints — UNLIMITED throughput
    location /api/upload/ {
        # UNLIMITED: No rate limits
        
        proxy_pass http://campusplayer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_buffer_size 0;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS, GET";
        add_header Access-Control-Allow-Headers "*";
    }
    
    # Main application
    location / {
        proxy_pass http://campusplayer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (SocketIO)
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts for long polling (SocketIO)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Buffer for main app
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

        # Health check
        location /api/health {
            proxy_pass http://campusplayer;
            access_log off;
        }
    }
}